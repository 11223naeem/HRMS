<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Attendance')}"></head>
<body>
<div th:replace="~{fragments :: nav('att')}"></div>
<div th:replace="~{fragments :: toast}"></div>
<main class="wrap">
  <div class="head"><h2>Face attendance</h2></div>
  <div class="card">
    <p class="muted">You must be within <b th:text="${radius}">100</b> m of the office. A day counts as present only after a
      face-verified check-out at least <b th:text="${minHours}">6</b> hours after check-in.</p>
    <div class="row big-row">
      <div>Check-in: <b th:text="${today != null and today.loginTime != null ? #temporals.format(today.loginTime, 'HH:mm:ss') : '-'}">-</b></div>
      <div>Check-out: <b th:text="${today != null and today.logoutTime != null ? #temporals.format(today.logoutTime, 'HH:mm:ss') : '-'}">-</b></div>
    </div>
    <div class="row">
      <button class="btn fbtn" th:data-url="@{/attendance/checkin}" onclick="run(this)">Face Check-in</button>
      <button class="btn alt fbtn" th:data-url="@{/attendance/checkout}" onclick="run(this)">Face Check-out</button>
    </div>
    <div id="camBox" class="camwrap" hidden><video id="cam" autoplay muted playsinline></video></div>
    <p id="status" class="status"></p>
  </div>

  <div class="card">
    <h3>Last 31 records</h3>
    <div class="scroll">
      <table>
        <tr><th>Date</th><th>Check-in</th><th>Check-out</th><th>Status</th></tr>
       <tr th:each="r : ${rows}">
  <td th:text="${#temporals.format(r.day, 'EEE, dd MMM yyyy')}"></td>
  <td th:text="${r.checkIn != null ? #temporals.format(r.checkIn, 'HH:mm:ss') : '-'}"></td>
  <td th:text="${r.checkOut != null ? #temporals.format(r.checkOut, 'HH:mm:ss') : '-'}"></td>
  <td><span class="tag"
            th:classappend="${r.status == 'PRESENT'} ? 'approved' : (${r.status == 'ABSENT'} ? 'rejected' : 'pending')"
            th:text="${r.status}"></span></td>
</tr>
      </table>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<script th:src="@{/js/face.js}"></script>
<script th:src="@{/js/attendance.js}"></script>
</body>
</html>
